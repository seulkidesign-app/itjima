eArYHTKEJBYdke+UIQFgbBU8OsIQmEjjCEISD//Z',P=['소금','식용유','간장','설탕','후추','버터'];let a=['계란','김치','햇반'],p=['소금','식용유','간장','후추'];function has(x){if(x==='밥')return a.some(v=>/밥|햇반/.test(v));if(x==='계란')return a.some(v=>/계란|달걀/.test(v));return a.some(v=>v.includes(x))}function draw(){chips.innerHTML=a.map((x,n)=>`<span class=chip>${x} <b onclick="a.splice(${n},1);draw()">×</b></span>`).join('');pans.innerHTML=P.map(x=>`<button class="p ${p.includes(x)?'on':''}" onclick="tog('${x}')">${p.includes(x)?'✓ ':''}${x}</button>`).join('')}function tog(x){p=p.includes(x)?p.filter(v=>v!==x):[...p,x];draw()}function add(){i.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean).forEach(x=>!a.includes(x)&&a.push(x));i.value='';draw()}function go(){res.classList.add('on');let kim=has('밥')&&has('계란')&&has('김치')&&p.includes('식용유'),egg=has('밥')&&has('계란')&&p.includes('간장')&&p.includes('식용유'),cake=has('밀가루')&&has('우유');if(kim){photo.style.display='block';photo.src=IMG;t.textContent='김치 계란 볶음밥';d.textContent='입력한 재료와 기본 조미료 안에서 실제로 가능한 메뉴예요.';met.innerHTML='<span class=m>⏱ 10분</span><span class=m>🥬 추가 재료 0개</span>';w.innerHTML='';s.innerHTML='<li>김치를 잘게 썰어 식용유에 2~3분 볶아요.</li><li>밥을 넣고 2분 정도 볶아요.</li><li>팬 한쪽에 계란을 익힌 뒤 밥과 섞어요.</li>'}else if(egg){photo.style.display='none';t.textContent='계란 볶음밥';d.textContent='간단하지만 실제로 성립하는 메뉴예요.';met.innerHTML='<span class=m>⏱ 8분</span><span class=m>🥬 추가 재료 0개</span>';w.innerHTML='';s.innerHTML='<li>식용유에 계란을 익혀요.</li><li>밥을 넣고 볶아요.</li><li>간장을 조금 넣어 마무리해요.</li>'}else if(cake&&!has('계란')){photo.style.display='none';t.textContent='딱 하나만 더 있으면 · 우유 팬케이크';d.textContent='밀가루와 우유만으로 억지 요리를 만들지 않을게요.';met.innerHTML='<span class=m>🛒 추가 재료 1개</span>';w.innerHTML='<div class=warn><b>+ 계란</b><br>이것만 있으면 팬케이크가 실제로 성립해요.</div>';s.innerHTML=''}else{photo.style.display='none';t.textContent='이 조합은 추천 보류';d.textContent='지금 재료만으로는 맛있는 한 끼라고 자신 있게 추천하기 어려워요.';met.innerHTML='<span class=m>🧑‍🍳 억지 레시피 생성 안 함</span>';w.innerHTML='<div class=warn>재료 하나를 더 추가해보세요.</div>';s.innerHTML
