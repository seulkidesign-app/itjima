name: Apply responsive fixes

on:
  push:
    branches: [agent/us-launch-positioning]

permissions:
  contents: write

concurrency:
  group: apply-responsive-fixes-agent-us-launch-positioning
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[responsive-fixes]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      VITE_E2E: "true"
      VITE_SUPABASE_URL: "http://127.0.0.1:54321"
      VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/us-launch-positioning
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Apply fixes
        run: node scripts/apply-responsive-fixes.mjs

      - name: Verify interaction audit
        run: node scripts/interaction-audit.mjs --strict

      - name: Validate production bundle
        run: npm run build

      - name: Commit fixes
        run: |
          git config user.name "itjima-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src e2e
          git commit -m "[responsive-fixes] Fix touch targets and nested sheets"
          git push origin HEAD:agent/us-launch-positioning
