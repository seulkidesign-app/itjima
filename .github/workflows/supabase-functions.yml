name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:
    inputs:
      function:
        description: Function to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - process-reminders
          - test-push
          - test-push-ios
          - delete-account

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bopiuworvbjsowfjbmfx
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is required."
            exit 1
          fi

      - name: Deploy Edge Functions
        shell: bash
        env:
          REQUESTED_FUNCTION: ${{ github.event.inputs.function || 'all' }}
        run: |
          set -euo pipefail
          functions=(process-reminders test-push test-push-ios delete-account)

          if [ "$REQUESTED_FUNCTION" = "all" ]; then
            selected=("${functions[@]}")
          else
            selected=("$REQUESTED_FUNCTION")
          fi

          for function_name in "${selected[@]}"; do
            echo "Deploying ${function_name}"
            supabase functions deploy "$function_name" \
              --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Verify deployed function inventory
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF")"
          printf '%s\n' "$inventory"
          for function_name in process-reminders test-push test-push-ios delete-account; do
            grep -Fq "$function_name" <<<"$inventory" || {
              echo "::error::${function_name} was not found in the deployed function inventory."
              exit 1
            }
          done
