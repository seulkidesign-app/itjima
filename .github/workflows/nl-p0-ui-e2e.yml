name: NL P0 UI E2E

on:
  push:
    branches:
      - test/nl-p0-ui-e2e-20260829

permissions:
  contents: read

env:
  CI: "true"
  VITE_E2E: "true"
  VITE_SUPABASE_URL: "http://127.0.0.1:54321"
  VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"

jobs:
  nl-p0-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run NL P0 UI contract
        run: npx playwright test e2e/nl-p0-user-contract.spec.ts --project=mobile-chrome
