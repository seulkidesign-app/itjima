name: Apply responsive master

on:
  push:
    branches: [agent/us-launch-positioning]

permissions:
  contents: write

concurrency:
  group: apply-responsive-master-agent-us-launch-positioning
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[responsive-master]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CI: "true"
      VITE_E2E: "true"
      VITE_SUPABASE_URL: "http://127.0.0.1:54321"
      VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/us-launch-positioning
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Apply responsive architecture and QA updates
        run: node scripts/apply-responsive-master.mjs

      - name: Verify interaction audit
        run: node scripts/interaction-audit.mjs --strict

      - name: Validate release build
        run: npm run build

      - name: Commit responsive master
        run: |
          git config user.name "itjima-responsive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src e2e playwright.config.ts .github/workflows/product-qa.yml .github/workflows/visual-smoke.yml
          git commit -m "[responsive-master] Perfect mobile tablet and desktop layouts"
          git push origin HEAD:agent/us-launch-positioning

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify tablet and desktop critical flows
        run: >-
          npx playwright test e2e/responsive-critical.spec.ts
          --project=tablet-chrome
          --project=desktop-chrome

      - name: Verify eleven-viewport responsive matrix
        run: npx playwright test e2e/responsive-matrix.spec.ts --project=responsive-matrix-chrome
