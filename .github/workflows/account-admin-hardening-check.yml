name: Account Admin Hardening Check

on:
  push:
    branches:
      - fix/account-admin-hardening-20260830

permissions:
  contents: read

env:
  CI: "true"
  VITE_E2E: "true"
  VITE_SUPABASE_URL: "http://127.0.0.1:54321"
  VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"

jobs:
  account-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run account/admin E2E
        run: npx playwright test e2e/admin-mobile.spec.ts --project=mobile-chrome
      - name: Build
        run: npm run build
