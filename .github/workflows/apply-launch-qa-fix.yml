name: Apply launch QA repair

on:
  push:
    branches: [agent/us-launch-positioning]

permissions:
  contents: write

concurrency:
  group: apply-launch-qa-repair
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[launch-qa-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      VITE_E2E: "true"
      VITE_SUPABASE_URL: "http://127.0.0.1:54321"
      VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/us-launch-positioning
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Apply repairs
        run: node scripts/fix-launch-qa.mjs

      - name: Audit interactions
        run: node scripts/interaction-audit.mjs --strict

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repaired product flows
        run: >-
          npx playwright test
          e2e/nl-beta.spec.ts
          e2e/nl-schedule.spec.ts
          e2e/product-reset.spec.ts
          e2e/responsive-ui.spec.ts
          e2e/responsive-critical.spec.ts
          --project=mobile-chrome

      - name: Validate production bundle
        run: npm run build

      - name: Commit verified repairs
        run: |
          git config user.name "itjima-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/components/BottomSheet.tsx \
            src/components/InlinePromise.tsx \
            e2e/nl-beta.spec.ts \
            e2e/nl-schedule.spec.ts \
            e2e/product-reset.spec.ts \
            e2e/responsive-ui.spec.ts
          git commit -m "[launch-qa-fix] Align release flows and restore focus"
          git push origin HEAD:agent/us-launch-positioning
