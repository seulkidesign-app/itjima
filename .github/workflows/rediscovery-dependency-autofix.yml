name: Temporary browserslist lock refresh

on:
  push:
    branches:
      - feat/rediscovery-ut-instrumentation-20260902
    paths:
      - .github/workflows/rediscovery-dependency-autofix.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rediscovery-ut-instrumentation-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh only the browserslist dependency resolution
        run: npm update browserslist --package-lock-only --ignore-scripts
      - name: Verify runtime audit
        run: npm audit --omit=dev
      - name: Commit lockfile patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change needed"
            exit 0
          fi
          git commit -m "chore: patch browserslist security advisory"
          git push origin HEAD:feat/rediscovery-ut-instrumentation-20260902
