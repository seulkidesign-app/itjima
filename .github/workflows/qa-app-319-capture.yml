name: QA App 319 Capture

on:
  push:
    branches: [qa/app-319-capture]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      VITE_E2E: "true"
      VITE_SUPABASE_URL: "http://127.0.0.1:54321"
      VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/itjima-preview.log 2>&1 &
          echo $! > /tmp/itjima-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/app >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/itjima-preview.log
          exit 1

      - name: Capture and diagnose empty Korean app Home
        run: |
          mkdir -p qa-app-319
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { writeFile } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            locale: 'ko-KR',
            deviceScaleFactor: 1,
            reducedMotion: 'reduce',
          });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:4173/app', {
            waitUntil: 'domcontentloaded',
            timeout: 20_000,
          });
          await page.evaluate(() => {
            localStorage.clear();
            sessionStorage.clear();
            localStorage.setItem('itjima_lang', 'ko');
          });
          await page.reload({ waitUntil: 'domcontentloaded' });
          await page.locator('body').waitFor({ state: 'visible', timeout: 10_000 });
          await page.waitForTimeout(800);

          const diagnostics = await page.evaluate(() => {
            const describe = (selector) => {
              const el = document.querySelector(selector);
              if (!el) return null;
              const rect = el.getBoundingClientRect();
              const style = getComputedStyle(el);
              const before = getComputedStyle(el, '::before');
              const after = getComputedStyle(el, '::after');
              return {
                selector,
                rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
                background: style.background,
                backgroundColor: style.backgroundColor,
                backgroundImage: style.backgroundImage,
                boxShadow: style.boxShadow,
                before: {
                  content: before.content,
                  display: before.display,
                  background: before.background,
                  backgroundColor: before.backgroundColor,
                  backgroundImage: before.backgroundImage,
                  opacity: before.opacity,
                  position: before.position,
                },
                after: {
                  content: after.content,
                  display: after.display,
                  background: after.background,
                  backgroundColor: after.backgroundColor,
                  backgroundImage: after.backgroundImage,
                  opacity: after.opacity,
                  position: after.position,
                },
              };
            };

            return {
              viewport: { width: innerWidth, height: innerHeight },
              elements: [
                'html',
                'body',
                '#root',
                '.itjima-app-stage',
                '.phone-frame',
                '.page-shell',
                '.itjima-app-scroll',
                '.home-chat-lane',
                '.mobile-app-header',
                '[data-testid="home-empty-hero"]',
                'form.composer-hero',
                '.mobile-bottom-nav',
                '[data-testid="open-browse-search"]'
              ].map(describe),
            };
          });

          await writeFile(
            'qa-app-319/diagnostics.json',
            JSON.stringify(diagnostics, null, 2),
            'utf8',
          );

          await page.screenshot({
            path: 'qa-app-319/app-empty-mobile-ko.png',
            animations: 'disabled',
            fullPage: false,
          });
          await browser.close();
          NODE

      - name: Upload app screenshot and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: qa-app-319-${{ github.run_number }}
          path: qa-app-319/*
          if-no-files-found: error
          retention-days: 7
