name: QA App 319 Capture

on:
  push:
    branches: [qa/app-319-capture]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/itjima-preview.log 2>&1 &
          echo $! > /tmp/itjima-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/app >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/itjima-preview.log
          exit 1

      - name: Capture empty Korean app Home
        run: |
          mkdir -p qa-app-319
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            locale: 'ko-KR',
            deviceScaleFactor: 1,
          });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:4173/app');
          await page.evaluate(() => {
            for (const key of Object.keys(localStorage)) {
              if (key.startsWith('itjima.')) localStorage.removeItem(key);
            }
            localStorage.setItem('itjima_lang', 'ko');
            sessionStorage.clear();
          });
          await page.reload();
          await page.waitForLoadState('networkidle');
          await page.screenshot({ path: 'qa-app-319/app-empty-mobile-ko.png', fullPage: false });
          await browser.close();
          NODE

      - name: Upload app screenshot
        uses: actions/upload-artifact@v4
        with:
          name: qa-app-319
          path: qa-app-319/app-empty-mobile-ko.png
          if-no-files-found: error
          retention-days: 7
