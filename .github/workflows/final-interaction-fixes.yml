name: Final interaction fixes

on:
  push:
    branches: [agent/us-launch-positioning]

permissions:
  contents: write

concurrency:
  group: final-interaction-fixes-agent-us-launch-positioning
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[final-interaction-fixes]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/us-launch-positioning
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Apply targeted fixes
        run: node scripts/apply-final-interaction-fixes.mjs

      - name: Verify zero interaction audit errors
        run: node scripts/interaction-audit.mjs --strict

      - name: Validate production bundle
        run: npm run build
        env:
          VITE_E2E: "true"
          VITE_SUPABASE_URL: "http://127.0.0.1:54321"
          VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"

      - name: Commit verified fixes
        run: |
          git config user.name "itjima-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "[final-interaction-fixes] Close remaining interaction audit gaps"
          git push origin HEAD:agent/us-launch-positioning
