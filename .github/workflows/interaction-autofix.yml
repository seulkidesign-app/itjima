name: Interaction autofix

on:
  push:
    branches: [agent/us-launch-positioning]

permissions:
  contents: write

concurrency:
  group: interaction-autofix-agent-us-launch-positioning
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[interaction-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/us-launch-positioning
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Apply conservative TSX fixes
        run: node scripts/autofix-interactions.mjs

      - name: Validate generated changes
        run: npm run build
        env:
          VITE_E2E: "true"
          VITE_SUPABASE_URL: "http://127.0.0.1:54321"
          VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No autofixes required."
            exit 0
          fi
          git config user.name "itjima-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "[interaction-autofix] Add explicit button types and input labels"
          git push origin HEAD:agent/us-launch-positioning
