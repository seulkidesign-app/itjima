name: Product QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interaction-and-flow-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      VITE_E2E: "true"
      VITE_SUPABASE_URL: "http://127.0.0.1:54321"
      VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Audit every interactive element
        run: node scripts/interaction-audit.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile tablet and desktop user flows
        run: npm run test:e2e

      - name: Upload interaction audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-audit-${{ github.event.pull_request.number || github.run_number }}
          path: qa-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.pull_request.number || github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
