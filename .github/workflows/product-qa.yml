name: Product QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  VITE_E2E: "true"
  VITE_SUPABASE_URL: "http://127.0.0.1:54321"
  VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"

jobs:
  interaction-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Audit every interactive element
        run: node scripts/interaction-audit.mjs --strict

      - name: Upload interaction audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-audit-${{ github.event.pull_request.number || github.run_number }}
          path: qa-artifacts/*
          if-no-files-found: error
          retention-days: 14

  mobile-regression:
    name: mobile-regression-${{ matrix.shard }}-of-4
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build current Figma 319 mobile contract set
        shell: bash
        run: |
          set -euo pipefail
          # These files are retained as historical regression material, but they
          # assert primary surfaces intentionally removed by the locked Figma 319
          # contract (Calendar, Archive primary nav, or mobile Settings), or mix
          # those assertions into otherwise older layout suites. Current behavior
          # is explicitly covered by figma-319-release.spec.ts plus the remaining
          # broad mobile suite.
          find e2e -maxdepth 1 -name '*.spec.ts' -print \
            | sort \
            | grep -Ev '/(admin-mobile|archive-organize|calendar-direct-editing|calendar-experience|crud-flows|data-integrity|design-polish-screenshots|home-capture|ia-navigation|m1-edit-delete-sync|navigation-modals|schedule-all-day|schedule-archive-v1|schedule-final-polish|schedule-range-management)\.spec\.ts$' \
            > qa-mobile-specs.txt

          test -s qa-mobile-specs.txt
          grep -Fx 'e2e/figma-319-release.spec.ts' qa-mobile-specs.txt
          echo "Blocking mobile Product QA specs:"
          cat qa-mobile-specs.txt

      - name: Run mobile regression shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t specs < qa-mobile-specs.txt
          npx playwright test "${specs[@]}" \
            --project=mobile-chrome \
            --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-${{ matrix.shard }}-${{ github.event.pull_request.number || github.run_number }}
          path: |
            playwright-report/
            test-results/
            qa-mobile-specs.txt
          if-no-files-found: ignore
          retention-days: 14

  responsive-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tablet and desktop critical flows
        run: >-
          npx playwright test e2e/responsive-critical.spec.ts
          --project=tablet-chrome
          --project=desktop-chrome

      - name: Upload responsive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-responsive-${{ github.event.pull_request.number || github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  responsive-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run eleven-viewport responsive matrix
        run: >-
          npx playwright test e2e/responsive-matrix.spec.ts
          --project=responsive-matrix-chrome

      - name: Upload responsive matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-responsive-matrix-${{ github.event.pull_request.number || github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
