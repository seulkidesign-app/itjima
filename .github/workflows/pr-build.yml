name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Capture runtime and full dependency audits
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-runtime.json || true
          npm audit --json > audit-full.json || true

      - name: Enforce runtime high and critical vulnerability gate
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const readAudit = (path) => {
            try {
              return JSON.parse(readFileSync(path, "utf8"));
            } catch (error) {
              console.error(`Could not parse ${path}:`, error);
              process.exit(1);
            }
          };

          const runtime = readAudit("audit-runtime.json");
          const full = readAudit("audit-full.json");
          const runtimeCounts = runtime.metadata?.vulnerabilities ?? {};
          const fullCounts = full.metadata?.vulnerabilities ?? {};
          const runtimeBlocking =
            Number(runtimeCounts.high ?? 0) + Number(runtimeCounts.critical ?? 0);

          console.log("Runtime dependency audit:", runtimeCounts);
          console.log("Full dependency audit, including developer tools:", fullCounts);

          if (runtimeBlocking > 0) {
            console.error(
              `Runtime dependencies contain ${runtimeBlocking} high or critical vulnerabilities.`,
            );
            process.exit(1);
          }

          const fullHigh = Number(fullCounts.high ?? 0);
          const fullCritical = Number(fullCounts.critical ?? 0);
          if (fullHigh + fullCritical > 0) {
            console.warn(
              `Developer tooling still reports ${fullHigh} high and ${fullCritical} critical vulnerabilities. See the uploaded audit artifact.`,
            );
          }
          NODE

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.event.pull_request.number || github.run_number }}
          path: |
            audit-runtime.json
            audit-full.json
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Run release build
        run: npm run build

      - name: Upload NL audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl-audit-report-${{ github.event.pull_request.number || github.run_number }}
          path: |
            artifacts/nl-adversarial-report.json
            artifacts/nl-temporal-shadow-audit.json
            artifacts/nl-temporal-timestamp-equivalence.json
            artifacts/nl-temporal-calendar-anchor-audit.json
          if-no-files-found: ignore
          retention-days: 7

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [security-audit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify production brand and metadata
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            html="$(curl -fsSL --max-time 20 https://itjima.app/ || true)"
            manifest="$(curl -fsSL --max-time 20 https://itjima.app/manifest.webmanifest || true)"
            final_manifest="$(curl -fsSL --max-time 20 https://itjima.app/manifest-v7.webmanifest || true)"

            wordmark_ok=false
            icon_ok=false
            og_ok=false

            if curl -fsSL --max-time 20 -o /dev/null https://itjima.app/brand/itjima-wordmark-v7.png; then
              wordmark_ok=true
            fi
            if curl -fsSL --max-time 20 -o /dev/null https://itjima.app/icons/itjima-512-v7.png; then
              icon_ok=true
            fi
            if curl -fsSL --max-time 20 -o /dev/null https://itjima.app/og-itjima-brand-v7.png; then
              og_ok=true
            fi

            if grep -Fq "/favicon-32-v7.png" <<<"$html" \
              && grep -Fq "/manifest-v7.webmanifest" <<<"$html" \
              && grep -Fq "/icons/itjima-192-v7.png" <<<"$manifest" \
              && grep -Fq "/icons/itjima-512-v7.png" <<<"$final_manifest" \
              && [[ "$wordmark_ok" == true ]] \
              && [[ "$icon_ok" == true ]] \
              && [[ "$og_ok" == true ]]; then
              echo "Production brand smoke check passed"
              exit 0
            fi

            echo "Production brand is not updated yet (attempt $attempt/20)"
            sleep 15
          done

          echo "::error::Production did not serve the final Itjima brand assets and metadata"
          exit 1
