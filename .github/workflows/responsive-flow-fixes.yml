name: Responsive flow fixes

on:
  push:
    branches: [agent/us-launch-positioning]

permissions:
  contents: write

concurrency:
  group: responsive-flow-fixes-agent-us-launch-positioning
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[responsive-flow-fixes]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
      VITE_E2E: "true"
      VITE_SUPABASE_URL: "http://127.0.0.1:54321"
      VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/us-launch-positioning
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Apply targeted fixes
        run: node scripts/apply-responsive-flow-fixes.mjs

      - name: Verify interaction audit
        run: node scripts/interaction-audit.mjs --strict

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify responsive critical flows
        run: >-
          npx playwright test e2e/responsive-critical.spec.ts
          --project=tablet-chrome
          --project=desktop-chrome

      - name: Validate release build
        run: npm run build

      - name: Commit verified fixes
        run: |
          git config user.name "itjima-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src e2e
          git commit -m "[responsive-flow-fixes] Fix touch targets and nested sheet flows"
          git push origin HEAD:agent/us-launch-positioning
