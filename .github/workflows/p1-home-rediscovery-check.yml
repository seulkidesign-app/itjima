name: P1 Home Rediscovery Check

on:
  push:
    branches:
      - feat/p1-home-rediscovery-20260830

permissions:
  contents: read

env:
  CI: "true"
  VITE_E2E: "true"
  VITE_SUPABASE_URL: "http://127.0.0.1:54321"
  VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"

jobs:
  p1-rediscovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Run P1 contract tests
        run: npx vitest run tests/home-rediscovery.test.ts
      - name: Build
        run: npm run build
