name: Temporary Primary Nav Contract Lock

on:
  push:
    branches:
      - "fix/figma-319-schedule"

permissions:
  contents: write

jobs:
  update-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply and commit final nav contract
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            echo "nav contract already committed"
            exit 0
          fi
          python scripts/tmp-lock-primary-nav-contract.py
          grep -Fq 'name: "Archive", exact: true })).toHaveCount(0)' e2e/responsive-critical.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/responsive-critical.spec.ts
          git commit -m "test: lock primary navigation to Capture and Schedule"
          git push origin HEAD:fix/figma-319-schedule
