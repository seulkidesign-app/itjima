name: Visual smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      VITE_E2E: "true"
      VITE_SUPABASE_URL: "http://127.0.0.1:54321"
      VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Start preview server
        run: |
          mkdir -p visual-artifacts
          npm run preview -- --host 127.0.0.1 > /tmp/itjima-preview.log 2>&1 &
          echo $! > /tmp/itjima-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/itjima-preview.log
          exit 1

      - name: Capture mobile tablet and desktop screens
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            echo "Chrome or Chromium is required for visual smoke testing."
            exit 1
          fi

          capture() {
            local width="$1"
            local height="$2"
            local output="$3"
            local url="$4"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size="${width},${height}" \
              --virtual-time-budget=3000 \
              --screenshot="visual-artifacts/${output}" \
              "$url"
          }

          # Mobile coverage: smallest supported width and a modern phone.
          capture 320 568 home-mobile-small-en.png "http://127.0.0.1:4173/?lang=en"
          capture 390 844 home-mobile-en.png "http://127.0.0.1:4173/?lang=en"
          capture 390 844 home-mobile-ko.png "http://127.0.0.1:4173/?lang=ko"
          capture 390 844 about-mobile-en.png "http://127.0.0.1:4173/about?lang=en"

          # Tablet coverage: portrait iPad-class layouts and bilingual rendering.
          capture 768 1024 home-tablet-en.png "http://127.0.0.1:4173/?lang=en"
          capture 834 1112 home-tablet-ko.png "http://127.0.0.1:4173/?lang=ko"
          capture 768 1024 schedule-tablet-en.png "http://127.0.0.1:4173/schedule?lang=en"
          capture 834 1112 about-tablet-en.png "http://127.0.0.1:4173/about?lang=en"

          # Desktop coverage: dedicated sidebar app shell and full launch page.
          capture 1440 1000 home-desktop-en.png "http://127.0.0.1:4173/?lang=en"
          capture 1440 1000 schedule-desktop-en.png "http://127.0.0.1:4173/schedule?lang=en"
          capture 1440 1000 archive-desktop-ko.png "http://127.0.0.1:4173/archive?lang=ko"
          capture 1440 1000 about-desktop-en.png "http://127.0.0.1:4173/about?lang=en"
          capture 1440 1000 about-desktop-ko.png "http://127.0.0.1:4173/about?lang=ko"

      - name: Verify screenshot dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              "home-mobile-small-en.png": (320, 568),
              "home-mobile-en.png": (390, 844),
              "home-mobile-ko.png": (390, 844),
              "about-mobile-en.png": (390, 844),
              "home-tablet-en.png": (768, 1024),
              "home-tablet-ko.png": (834, 1112),
              "schedule-tablet-en.png": (768, 1024),
              "about-tablet-en.png": (834, 1112),
              "home-desktop-en.png": (1440, 1000),
              "schedule-desktop-en.png": (1440, 1000),
              "archive-desktop-ko.png": (1440, 1000),
              "about-desktop-en.png": (1440, 1000),
              "about-desktop-ko.png": (1440, 1000),
          }

          for filename, size in expected.items():
              path = Path("visual-artifacts") / filename
              if not path.exists():
                  raise SystemExit(f"Missing screenshot: {filename}")
              with Image.open(path) as image:
                  if image.size != size:
                      raise SystemExit(
                          f"Unexpected size for {filename}: {image.size}, expected {size}"
                      )
          PY

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-${{ github.event.pull_request.number || github.run_number }}
          path: visual-artifacts/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/itjima-preview.pid ]; then
            kill "$(cat /tmp/itjima-preview.pid)" || true
          fi
