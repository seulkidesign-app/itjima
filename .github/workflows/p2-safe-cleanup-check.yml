name: P2 Safe Cleanup Check

on:
  push:
    branches:
      - feat/p2-safe-cleanup-20260830

permissions:
  contents: read

env:
  CI: "true"
  VITE_E2E: "true"
  VITE_SUPABASE_URL: "http://127.0.0.1:54321"
  VITE_SUPABASE_PUBLISHABLE_KEY: "e2e-placeholder"

jobs:
  p2-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Run P2 contract tests
        run: npx vitest run tests/cleanup-review.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run P2 mobile E2E
        run: npx playwright test e2e/p2-cleanup.spec.ts --project=mobile-chrome
      - name: Build
        run: npm run build
