name: Deploy Supabase functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: bopiuworvbjsowfjbmfx
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured; deployment was skipped."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.available == 'true'
        with:
          version: latest

      - name: Deploy all Edge Functions
        if: steps.credentials.outputs.available == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
