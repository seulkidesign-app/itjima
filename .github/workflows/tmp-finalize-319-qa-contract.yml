name: Temporary Finalize 319 QA Contract

on:
  push:
    branches:
      - "fix/figma-319-schedule"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply fixes and self-clean
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            echo "already finalized"
            exit 0
          fi
          python scripts/tmp-finalize-319-qa-contract.py
          grep -Fq 'width: 44px !important' src/ui-quietly-organized.css
          grep -Fq 'schedule-tab-cal")).toHaveCount(0)' e2e/responsive-ui.spec.ts
          grep -Fq 'name: "Archive", exact: true })).toHaveCount(0)' e2e/responsive-matrix.spec.ts
          rm scripts/tmp-finalize-319-qa-contract.py
          rm .github/workflows/tmp-finalize-319-qa-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align 319 accessibility and QA contracts"
          git push origin HEAD:fix/figma-319-schedule
